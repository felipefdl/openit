# cargo-deny: advisories, licenses, bans, sources. Fail the gate on real risk.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
# cargo-deny 0.20+: vulnerabilities always error; configure unmaintained/yanked/unsound.
# Docs: https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
ignore = []
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
unused-ignored-advisory = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MIT-0",
  "0BSD",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  # cbindgen (build script of gpui-pre's wgpu stack), dwrote (Windows text on
  # gpui-pre-windows), option-ext (dirs-sys, via gpui-kit), nucleo-matcher.
  "MPL-2.0",
  # libbz2-rs-sys, pulled by gpui-pre-reqwest-client through bzip2.
  "bzip2-1.0.6",
]
unused-allowed-license = "deny"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
