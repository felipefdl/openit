name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-14
          - ubuntu-22.04
          - windows-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Enable long paths for dependency checkouts
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-audit,cargo-machete
      - uses: swatinem/rust-cache@v2
      - name: Install Linux deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libssl-dev libzstd-dev
      - name: Quality gate
        run: just check
      - name: Release build
        run: cargo build --release -p openit
      - name: Stop leftover processes
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          pkill -9 -f '/Users/runner/work/openit/openit/target/' || true
